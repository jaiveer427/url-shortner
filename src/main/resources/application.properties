spring.application.name=url-shortener

spring.datasource.url=jdbc:postgresql://localhost:5432/learning
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=validate

#flyway enabled
spring.flyway.enabled=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# 2. Format SQL nicely and add comments showing which JPA/JPQL query triggered it
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# 3. Enable SQL statement logging via your logging framework (Logback)
logging.level.org.hibernate.SQL=DEBUG

# 4. Log the actual parameter values bound to '?' (Spring Boot 3.x / Hibernate 6+)
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Force ANSI colors in IntelliJ, Eclipse, VS Code, or terminal
spring.output.ansi.enabled=always

# Color-coded console pattern
logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr([%thread]){magenta} %clr(%-5level) %clr(%logger{36}){cyan} %clr(-){faint} %msg%n

management.endpoints.web.exposure.include=health,metrics,prometheus
management.prometheus.metrics.export.enabled=true
spring.datasource.hikari.pool-name=UrlShortenerPool

# Optional: Enable percentile histograms for HikariCP acquire & usage timers
management.metrics.distribution.percentiles-histogram.hikaricp.connections.acquire=true
management.metrics.distribution.percentiles-histogram.hikaricp.connections.usage=true

